services:
  backend:
    build: .  # Construye la imagen desde el Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://admin:@db:3306/limpieza_db
    depends_on:
      - db

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: limpieza_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: 
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: